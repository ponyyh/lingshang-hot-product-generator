<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深冬跨境 - 登录</title>
  <link rel="icon" type="image/png" href="./assets/brand-logo-icon.png?v=2">
  <link rel="stylesheet" href="./login.css">
</head>
<body>
  <!-- 顶部浮动提示 Toast -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- 登录页全屏画布 -->
  <main class="login-page">
    <!-- 左上角品牌 Logo -->
    <a href="javascript:void(0)" class="login-brand" title="深冬跨境">
      <img src="./assets/brand-logo-full.png" alt="深冬跨境" class="login-brand-img">
    </a>

    <!-- 右侧浮动登录卡片（1440×900 1x 规范：宽 416px、内边距 40px、右边距 120px） -->
    <section class="login-card" aria-label="深冬跨境登录">
      <h1 class="login-title">欢迎来到深冬跨境</h1>

      <!-- 登录方式切换 Tab -->
      <div class="login-tabs" role="tablist">
        <button type="button" class="login-tab active" id="tabAccount" role="tab" aria-selected="true" data-tab="account">
          账号登录
        </button>
        <button type="button" class="login-tab" id="tabPhone" role="tab" aria-selected="false" data-tab="phone">
          手机号登录
        </button>
      </div>

      <!-- Tab 1：账号登录表单（还原容器 106 & 容器 117） -->
      <form id="accountForm" class="login-form" novalidate>
        <div class="input-group">
          <input
            type="text"
            id="usernameInput"
            class="login-input"
            placeholder="请输入用户名"
            autocomplete="username"
          >
        </div>

        <div class="input-group has-suffix">
          <input
            type="password"
            id="passwordInput"
            class="login-input"
            placeholder="请输入登录密码"
            autocomplete="current-password"
          >
          <button type="button" id="togglePwdBtn" class="pwd-toggle-btn" aria-label="显示或隐藏密码" title="显示密码">
            <!-- 密码隐藏态：闭眼睫毛图标（还原容器 106） -->
            <svg class="eye-closed-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 8.5c1.5 2.4 3.8 3.6 6.5 3.6s5-1.2 6.5-3.6"/>
              <path d="M6.2 11.4L4.8 13.5"/>
              <path d="M10 12.2v2.4"/>
              <path d="M13.8 11.4l1.4 2.1"/>
            </svg>
            <!-- 密码显示态：睁眼图标（还原容器 117） -->
            <svg class="eye-open-icon hidden" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.5 10C4.2 6.8 6.8 5.2 10 5.2s5.8 1.6 7.5 4.8c-1.7 3.2-4.3 4.8-7.5 4.8S4.2 13.2 2.5 10Z"/>
              <circle cx="10" cy="10" r="2.3"/>
            </svg>
          </button>
        </div>

        <button type="submit" id="accountSubmitBtn" class="login-submit-btn">立即登录</button>

        <div class="login-footer-row">
          <div class="footer-left">
            <span class="footer-muted">没有账号？</span>
            <a href="javascript:void(0)" id="goRegisterLink" class="footer-link-primary">去注册</a>
          </div>
          <a href="javascript:void(0)" id="forgotPwdLink" class="footer-link-muted">忘记密码</a>
        </div>
      </form>

      <!-- Tab 2：手机号登录表单（还原容器 116） -->
      <form id="phoneForm" class="login-form hidden" novalidate>
        <div class="input-group">
          <input
            type="tel"
            id="phoneInput"
            class="login-input"
            placeholder="请输入手机号"
            maxlength="11"
            autocomplete="tel"
          >
        </div>

        <div class="input-group code-row">
          <input
            type="text"
            id="smsCodeInput"
            class="login-input"
            placeholder="请输入验证码"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
          >
          <button type="button" id="sendCodeBtn" class="sms-code-btn">获取验证码</button>
        </div>

        <button type="submit" id="phoneSubmitBtn" class="login-submit-btn">立即登录</button>

        <div class="login-footer-row">
          <a href="javascript:void(0)" id="noCodeLink" class="footer-link-muted">收不到验证码？</a>
        </div>
      </form>
    </section>
  </main>

  <script src="./api.js"></script>
  <script src="./login.js"></script>
</body>
</html>
